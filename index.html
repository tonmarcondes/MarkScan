<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MarkScan OMR - Correção Automática de Provas</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="app-root">
    <!-- Header -->
    <header id="app-header">
      <div class="header-inner">
        <div class="logo">MarkScan</div>
        <div class="header-actions">
          <span class="status-badge" id="status-badge">Offline Ready</span>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main id="app-main">
      <p role="status">Carregando MarkScan…</p>
    </main>

    <!-- Footer / Info -->
    <footer id="app-footer">
      <p>MarkScan OMR - Sistema de Correção Automática de Provas</p>
      <p>Desenvolvido para uso offline e em ambientes sem internet</p>
    </footer>
  </div>

  <script>
    if (location.protocol === 'file:') {
      document.getElementById('app-main').innerHTML = '<section class="step-card"><h3>Abra pelo servidor local</h3><p>Este aplicativo usa módulos JavaScript. Na pasta markscan, execute <code>python3 -m http.server 8080</code> e acesse <a href="http://localhost:8080">http://localhost:8080</a>.</p></section>';
    }
  </script>

  <!-- Module imports -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
